{{define "content"}}
<div class="min-h-[calc(100vh-12rem)] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md animate-fade-in-up">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-rose-400 to-mauve-500 shadow-soft mb-4">
                <span class="text-3xl">🌙</span>
            </div>
            <h1 class="text-3xl font-display font-semibold text-gradient mb-2">月汐</h1>
            <p class="text-gray-500 dark:text-gray-400 text-sm">开启温柔的记录之旅</p>
        </div>

        <div class="glass-card rounded-3xl shadow-soft p-7 sm:p-8">
            <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100 text-center mb-6 font-serif-cn">创建账号</h2>

            {{if .Error}}
            <div class="bg-rose-50 dark:bg-rose-900/20 border border-rose-100 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 text-sm px-4 py-3 rounded-xl mb-5 animate-fade-in-up" x-data="{show:true}" x-show="show" x-init="setTimeout(()=>show=false,4000)">
                {{.Error}}
            </div>
            {{end}}

            <form action="/register" method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">用户名</label>
                    <input type="text" name="username" required autofocus minlength="2" maxlength="20"
                        class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all input-elegant backdrop-blur-sm"
                        placeholder="2-20个字符">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">密码</label>
                    <input type="password" name="password" required minlength="8"
                        class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all input-elegant backdrop-blur-sm"
                        placeholder="至少8个字符">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">确认密码</label>
                    <input type="password" name="confirm" required
                        class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-rose-500 focus:border-rose-500 outline-none transition-all input-elegant backdrop-blur-sm"
                        placeholder="再次输入密码">
                </div>
                <button type="submit" class="w-full btn-primary text-white px-4 py-3 rounded-xl text-sm font-medium">
                    注 册
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/login" class="text-sm text-rose-500 dark:text-rose-400 hover:text-rose-600 dark:hover:text-rose-300 font-medium transition-colors">
                    已有账号？返回登录 →
                </a>
            </div>
        </div>
    </div>
</div>
{{end}}
