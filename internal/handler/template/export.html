{{define "content"}}
<div class="max-w-2xl mx-auto animate-fade-in-up">
    <div class="mb-6">
        <h1 class="text-2xl font-display font-semibold text-gray-800 dark:text-gray-100">导入 / 导出</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">备份和迁移你的数据</p>
    </div>

    <div class="glass-card rounded-2xl shadow-soft p-6 mb-5 animate-fade-in-up animate-delay-100">
        <div class="flex items-start gap-4">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-rose-400/20 to-mauve-400/20 flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            </div>
            <div class="flex-1">
                <h2 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5 font-serif-cn">导出数据</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">将数据导出为 JSON 文件，可用于备份或迁移到其他实例</p>
                <a href="/export/download" class="inline-flex items-center gap-2 btn-primary text-white px-4 py-2.5 rounded-xl text-sm font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    导出全部数据
                </a>
            </div>
        </div>
    </div>

    <div class="glass-card rounded-2xl shadow-soft p-6 animate-fade-in-up animate-delay-200">
        <div class="flex items-start gap-4">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-mauve-400/20 to-blue-400/20 flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 text-mauve-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            </div>
            <div class="flex-1">
                <h2 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5 font-serif-cn">导入数据</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">从之前导出的 JSON 文件导入数据。导入会创建新的人员和记录</p>
                <form action="/import" method="POST" enctype="multipart/form-data" class="space-y-4">
                    <div>
                        <label class="block w-full cursor-pointer">
                            <div class="border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl px-4 py-6 text-center hover:border-rose-300 dark:hover:border-rose-700 hover:bg-rose-50/30 dark:hover:bg-rose-900/10 transition-colors">
                                <svg class="w-8 h-8 text-gray-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                                <p class="text-sm text-gray-500 dark:text-gray-400" id="fileName">点击选择 JSON 文件</p>
                            </div>
                            <input type="file" name="file" accept=".json" required class="hidden" onchange="document.getElementById('fileName').textContent = this.files[0]?.name || '点击选择 JSON 文件'">
                        </label>
                    </div>
                    <button type="submit" class="inline-flex items-center gap-2 btn-primary text-white px-4 py-2.5 rounded-xl text-sm font-medium">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        导入数据
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="mt-5 pb-6">
        <a href="/" class="inline-flex items-center gap-1.5 text-sm text-rose-500 dark:text-rose-400 hover:text-rose-600 dark:hover:text-rose-300 font-medium transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            返回日历
        </a>
    </div>
</div>
{{end}}
