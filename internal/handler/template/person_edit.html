{{define "content"}}
<div class="max-w-lg mx-auto animate-fade-in-up">
    <div class="mb-6">
        <h1 class="text-2xl font-display font-semibold text-gray-800 dark:text-gray-100">编辑人员</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">修改人员信息</p>
    </div>

    <div class="glass-card rounded-2xl shadow-soft p-6 sm:p-7">
        <form action="/person/edit?id={{.Person.ID}}" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">姓名</label>
                <input type="text" name="name" value="{{.Person.Name}}" required class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 focus:border-transparent outline-none transition-all input-elegant backdrop-blur-sm">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">月经周期（天）</label>
                    <input type="number" name="cycle_length" value="{{.Person.CycleLength}}" min="20" max="45" class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 focus:border-transparent outline-none transition-all input-elegant backdrop-blur-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">经期时长（天）</label>
                    <input type="number" name="period_length" value="{{.Person.PeriodLength}}" min="2" max="10" class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 focus:border-transparent outline-none transition-all input-elegant backdrop-blur-sm">
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="btn-primary text-white px-5 py-2.5 rounded-xl text-sm font-medium">
                    保存修改
                </button>
                <a href="/person" class="flex-1 sm:flex-none border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors text-center">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>
{{end}}
