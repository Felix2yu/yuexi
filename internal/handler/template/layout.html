{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>月汐 - 月经记录</title>
    <meta name="description" content="月经记录与周期预测">
    <meta name="theme-color" content="#fce7f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1625" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="月汐">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        (function() {
            try {
                var s = JSON.parse(localStorage.getItem('yuexi_settings') || '{}');
                var theme = s.theme || 'system';
                var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
            } catch(e) {}
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif SC"', '"Cormorant Garamond"', 'serif'],
                        display: ['"Cormorant Garamond"', '"Noto Serif SC"', 'serif'],
                        sans: ['Inter', '"Noto Serif SC"', 'sans-serif'],
                    },
                    colors: {
                        rose: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                        },
                        mauve: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                        },
                        cream: {
                            50: '#fefdfb',
                            100: '#fdf8f3',
                            200: '#f9f0e6',
                        },
                        ink: {
                            900: '#1a1625',
                            800: '#2d2640',
                            700: '#3d3555',
                            600: '#4e4568',
                        }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', 'Noto Serif SC', sans-serif;
        }
        .font-display {
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
        }
        .font-serif-cn {
            font-family: 'Noto Serif SC', serif;
        }

        .bg-gradient-soft {
            background: linear-gradient(135deg, #fdf2f8 0%, #faf5ff 50%, #fef3c7 100%);
        }
        .dark .bg-gradient-soft {
            background: linear-gradient(135deg, #1a1625 0%, #2d2640 50%, #1f2937 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .dark .glass-card {
            background: rgba(45, 38, 64, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .shadow-soft {
            box-shadow: 0 4px 24px -4px rgba(236, 72, 153, 0.15), 0 2px 8px -2px rgba(168, 85, 247, 0.1);
        }
        .dark .shadow-soft {
            box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.4), 0 2px 8px -2px rgba(0, 0, 0, 0.2);
        }

        .shadow-elegant {
            box-shadow: 0 1px 3px rgba(236, 72, 153, 0.08), 0 8px 24px -8px rgba(236, 72, 153, 0.12);
        }

        .text-gradient {
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px -4px rgba(236, 72, 153, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }

        .nav-link {
            position: relative;
            transition: color 0.2s ease;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ec4899, #a855f7);
            border-radius: 2px;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        .input-elegant {
            transition: all 0.2s ease;
        }
        .input-elegant:focus {
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
        }
        .animate-delay-100 { animation-delay: 0.1s; }
        .animate-delay-200 { animation-delay: 0.2s; }
        .animate-delay-300 { animation-delay: 0.3s; }

        .decorative-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }
    </style>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
        function loadSettings() {
            try { return JSON.parse(localStorage.getItem('yuexi_settings') || '{}'); } catch(e) { return {}; }
        }
        function saveSettings(s) { localStorage.setItem('yuexi_settings', JSON.stringify(s)); }
    </script>
</head>
<body class="bg-gradient-soft dark:bg-gradient-soft min-h-screen transition-colors relative overflow-x-hidden" style="padding-top: env(safe-area-inset-top)">

    <div class="decorative-blob w-96 h-96 bg-rose-200 dark:bg-rose-900/30 -top-48 -right-48"></div>
    <div class="decorative-blob w-80 h-80 bg-mauve-200 dark:bg-mauve-900/30 top-1/3 -left-40"></div>

    <nav class="relative z-10 glass-card sticky top-0">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 group">
                <span class="text-2xl">🌙</span>
                <span class="text-xl sm:text-2xl font-display font-semibold text-gradient tracking-wide">月汐</span>
            </a>
            <div class="flex items-center gap-1 sm:gap-5">
                <a href="/" class="nav-link text-gray-600 dark:text-gray-300 hover:text-rose-500 dark:hover:text-rose-400 text-sm font-medium hidden sm:block">日历</a>
                <a href="/stats" class="nav-link text-gray-600 dark:text-gray-300 hover:text-rose-500 dark:hover:text-rose-400 text-sm font-medium hidden sm:block">统计</a>
                <a href="/person" class="nav-link text-gray-600 dark:text-gray-300 hover:text-rose-500 dark:hover:text-rose-400 text-sm font-medium hidden sm:block nav-family-only">人员</a>
                <a href="/settings" class="nav-link text-gray-600 dark:text-gray-300 hover:text-rose-500 dark:hover:text-rose-400 text-sm font-medium hidden sm:block">设置</a>
                <a href="/export" class="nav-link text-gray-600 dark:text-gray-300 hover:text-rose-500 dark:hover:text-rose-400 text-sm font-medium hidden sm:block">导出</a>

                <div class="sm:hidden flex items-center gap-1">
                    <a href="/" class="p-2 text-gray-600 dark:text-gray-300 hover:text-rose-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    </a>
                    <a href="/stats" class="p-2 text-gray-600 dark:text-gray-300 hover:text-rose-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    </a>
                    <a href="/settings" class="p-2 text-gray-600 dark:text-gray-300 hover:text-rose-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </a>
                </div>

                {{if .CurrentUser}}
                <span class="text-gray-300 dark:text-gray-600 hidden sm:inline">|</span>
                <span class="text-gray-600 dark:text-gray-300 text-sm hidden sm:inline font-medium">{{.CurrentUser}}</span>
                <form action="/logout" method="POST" class="inline">
                    <button type="submit" class="text-gray-500 hover:text-rose-500 dark:hover:text-rose-400 text-sm font-medium transition-colors">退出</button>
                </form>
                {{end}}
            </div>
        </div>
    </nav>

    <main class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
        {{template "content" .}}
    </main>

    <script>
        (function() {
            try {
                var s = JSON.parse(localStorage.getItem('yuexi_settings') || '{}');
                if (!s.familyMode) {
                    document.querySelectorAll('.nav-family-only').forEach(function(el) { el.style.display = 'none'; });
                }
            } catch(e) {}
        })();
    </script>
</body>
</html>{{end}}
