{{define "content"}}
<div class="max-w-2xl mx-auto animate-fade-in-up">
    <div class="mb-6">
        <h1 class="text-2xl font-display font-semibold text-gray-800 dark:text-gray-100">人员管理</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">管理记录对象</p>
    </div>

    <div class="glass-card rounded-2xl shadow-soft p-6 mb-5 animate-fade-in-up animate-delay-100">
        <h2 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-4 font-serif-cn">添加人员</h2>
        <form action="/person/create" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">姓名</label>
                <input type="text" name="name" required class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 focus:border-transparent outline-none transition-all input-elegant backdrop-blur-sm" placeholder="请输入姓名">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">月经周期（天）</label>
                    <input type="number" name="cycle_length" value="28" min="20" max="45" class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 focus:border-transparent outline-none transition-all input-elegant backdrop-blur-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">经期时长（天）</label>
                    <input type="number" name="period_length" value="5" min="2" max="10" class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 focus:border-transparent outline-none transition-all input-elegant backdrop-blur-sm">
                </div>
            </div>
            <button type="submit" class="btn-primary text-white px-5 py-2.5 rounded-xl text-sm font-medium">
                添加人员
            </button>
        </form>
    </div>

    <div class="glass-card rounded-2xl shadow-soft p-6 animate-fade-in-up animate-delay-200">
        <h2 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-4 font-serif-cn">已添加人员</h2>
        {{if .Persons}}
        <div class="space-y-3">
            {{range .Persons}}
            <div class="flex items-center justify-between p-4 rounded-xl bg-rose-50/40 dark:bg-rose-900/10 border border-rose-100/50 dark:border-rose-900/20 hover:bg-rose-50/60 dark:hover:bg-rose-900/20 transition-colors">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-400/20 to-mauve-400/20 flex items-center justify-center">
                        <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                    <div>
                        <div class="font-medium text-gray-800 dark:text-gray-200">{{.Name}}</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">周期 {{.CycleLength}} 天 · 经期 {{.PeriodLength}} 天</div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <a href="/person/edit?id={{.ID}}" class="text-rose-500 dark:text-rose-400 hover:text-rose-600 dark:hover:text-rose-300 text-sm font-medium transition-colors">编辑</a>
                    <form action="/person/delete" method="POST" class="inline" onsubmit="return confirm('确定删除 {{.Name}}？所有相关记录也将被删除。')">
                        <input type="hidden" name="id" value="{{.ID}}">
                        <button type="submit" class="text-gray-400 hover:text-rose-500 text-sm font-medium transition-colors">删除</button>
                    </form>
                </div>
            </div>
            {{end}}
        </div>
        {{else}}
        <p class="text-sm text-gray-500 dark:text-gray-400 text-center py-8">暂无人员，请先添加</p>
        {{end}}
    </div>

    <div class="mt-5 pb-6">
        <a href="/" class="inline-flex items-center gap-1.5 text-sm text-rose-500 dark:text-rose-400 hover:text-rose-600 dark:hover:text-rose-300 font-medium transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            返回日历
        </a>
    </div>
</div>
{{end}}
