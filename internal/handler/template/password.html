{{define "content"}}
<div class="max-w-md mx-auto animate-fade-in-up">
    <div class="mb-6">
        <h1 class="text-2xl font-display font-semibold text-gray-800 dark:text-gray-100">修改密码</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">保护你的账户安全</p>
    </div>

    {{if .Error}}
    <div class="bg-rose-50 dark:bg-rose-900/20 border border-rose-100 dark:border-rose-900/30 text-rose-600 dark:text-rose-400 px-4 py-3 rounded-xl mb-5 text-sm animate-fade-in-up">
        {{.Error}}
    </div>
    {{end}}

    {{if .Success}}
    <div class="bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-900/30 text-emerald-600 dark:text-emerald-400 px-4 py-3 rounded-xl mb-5 text-sm animate-fade-in-up">
        {{.Success}}
    </div>
    {{end}}

    <div class="glass-card rounded-2xl shadow-soft p-6 sm:p-7">
        <form action="/settings/password" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">旧密码</label>
                <input type="password" name="old_password" required
                    class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 focus:border-transparent outline-none transition-all input-elegant backdrop-blur-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">新密码</label>
                <input type="password" name="new_password" required minlength="8"
                    class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 focus:border-transparent outline-none transition-all input-elegant backdrop-blur-sm">
                <p class="text-xs text-gray-400 dark:text-gray-500 mt-1.5">至少 8 个字符</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 dark:text-gray-400 mb-2">确认新密码</label>
                <input type="password" name="confirm_password" required minlength="8"
                    class="w-full border border-gray-200 dark:border-gray-700 bg-white/70 dark:bg-ink-800/70 text-gray-800 dark:text-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-rose-500 focus:border-transparent outline-none transition-all input-elegant backdrop-blur-sm">
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button type="submit" class="btn-primary text-white px-5 py-2.5 rounded-xl text-sm font-medium">
                    修改密码
                </button>
                <a href="/settings" class="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 font-medium transition-colors">
                    取消
                </a>
            </div>
        </form>
    </div>
</div>
{{end}}
